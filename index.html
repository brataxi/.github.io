<!DOCTYPE html>
<html lang="mn-MN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRA Taxi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 420px;
      margin: 30px auto;
      background: #1f1f1f;
      padding: 25px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      color: #00ff99;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #00b894;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #009f7a;
    }

    #msg {
      text-align: center;
      margin-top: 15px;
      color: #00ff99;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>BRA TAXI</h1>

    <label>Маршрут</label>
    <select id="route">
      <option value="">Маршрут сонгоно уу</option>
      <option value="Улаанбаатар → Багануур">Улаанбаатар → Багануур</option>
      <option value="Багануур → Улаанбаатар">Багануур → Улаанбаатар</option>
    </select>

    <label>Явах өдөр</label>
    <input id="date" type="date">

    <label>Явах цаг</label>
<select id="time">
  <option value="">Цаг сонгоно уу</option>
  <option value="06:00">06:00</option>
  <option value="07:00">07:00</option>
  <option value="08:00">08:00</option>
  <option value="09:00">09:00</option>
  <option value="10:00">10:00</option>
  <option value="11:00">11:00</option>
  <option value="12:00">12:00</option>
  <option value="13:00">13:00</option>
  <option value="14:00">14:00</option>
  <option value="15:00">15:00</option>
  <option value="16:00">16:00</option>
  <option value="17:00">17:00</option>
  <option value="18:00">18:00</option>
  <option value="19:00">19:00</option>
  <option value="20:00">20:00</option>
  <option value="21:00">21:00</option>
  <option value="22:00">22:00</option>
  <option value="23:00">23:00</option>
</select>

    <label>Хэдэн хүн</label>
    <select id="count">
      <option value="">Хүний тоо сонгоно уу</option>
      <option value="1">1 хүн</option>
      <option value="2">2 хүн</option>
      <option value="3">3 хүн</option>
      <option value="4">4 хүн</option>
    </select>

    <label>Утасны дугаар</label>
    <input id="phone" type="tel" placeholder="Жишээ: 99112233">

    <label>Нэмэлт тайлбар</label>
    <textarea id="note" placeholder="Жишээ: 14:00 цагт 2 хүн хот явна"></textarea>

    <button onclick="sendRequest()">Илгээх</button>

    <div id="msg"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdzwJSNY1jBEA7qDaSiLFBIAJJEDRzo",
    authDomain: "brataxi-a3231.firebaseapp.com",
    projectId: "brataxi-a3231",
    storageBucket: "brataxi-a3231.firebasestorage.app",
    messagingSenderId: "1047098990409",
    appId: "1:1047098990409:web:3646dbbd62ae56db4ac498"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

const today = new Date();

const yyyy = today.getFullYear();

const mm = String(today.getMonth() + 1).padStart(2, '0');

const dd = String(today.getDate()).padStart(2, '0');

const formattedDate = `${yyyy}-${mm}-${dd}`;

document.getElementById("date").value = formattedDate;

  window.sendRequest = async function () {
    const route = document.getElementById("route").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const count = document.getElementById("count").value;
    const phone = document.getElementById("phone").value;
    const note = document.getElementById("note").value;

    if (!route || !date || !time || !count || !phone) {
      document.getElementById("msg").innerHTML = "Бүх талбарыг бөглөнө үү ❗";
      return;
    }

    try {
      await addDoc(collection(db, "requests"), {
        route: route,
        date: date,
        time: time,
        passengerCount: count,
        phone: phone,
        note: note,
        status: "new",
        createdAt: new Date()
      });

      document.getElementById("msg").innerHTML = "Амжилттай илгээгдлээ ✅";

      document.getElementById("route").value = "";
      document.getElementById("date").value = "";
      document.getElementById("time").value = "";
      document.getElementById("count").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("note").value = "";

    } catch (error) {
      document.getElementById("msg").innerHTML = "Алдаа гарлаа ❌";
      console.log(error);
    }
  }
</script>

</body>
</html>
